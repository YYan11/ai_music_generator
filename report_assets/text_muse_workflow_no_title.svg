<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360" role="img" aria-label="Text Muse workflow diagram">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#26305f"/>
    </marker>
    <style>
      .bg { fill: #fbf6ec; }
      .box { fill: #ffffff; stroke: #26305f; stroke-width: 4; rx: 22; }
      .box-blue { fill: #e9f1ff; stroke: #26305f; stroke-width: 4; rx: 22; }
      .box-green { fill: #dff4ee; stroke: #26305f; stroke-width: 4; rx: 22; }
      .box-yellow { fill: #fff4c7; stroke: #26305f; stroke-width: 4; rx: 22; }
      .box-pink { fill: #ffe8ec; stroke: #26305f; stroke-width: 4; rx: 22; }
      .label { font: 700 28px Arial, sans-serif; fill: #26305f; }
      .small { font: 400 20px Arial, sans-serif; fill: #3d456f; }
      .arrow { stroke: #26305f; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="360"/>

  <rect class="box-blue" x="40" y="120" width="180" height="105" rx="22"/>
  <text class="label" x="130" y="160" text-anchor="middle">User</text>
  <text class="small" x="130" y="190" text-anchor="middle">Prompt</text>

  <path class="arrow" d="M220 172 L290 172"/>

  <rect class="box" x="300" y="120" width="205" height="105" rx="22"/>
  <text class="label" x="402.5" y="160" text-anchor="middle">Chatbot</text>
  <text class="small" x="402.5" y="190" text-anchor="middle">Interaction</text>

  <path class="arrow" d="M505 172 L575 172"/>

  <rect class="box-green" x="585" y="120" width="220" height="105" rx="22"/>
  <text class="label" x="695" y="160" text-anchor="middle">Emotion</text>
  <text class="small" x="695" y="190" text-anchor="middle">Detection</text>

  <path class="arrow" d="M805 172 L875 172"/>

  <rect class="box-green" x="885" y="120" width="220" height="105" rx="22"/>
  <text class="label" x="995" y="160" text-anchor="middle">Emotion</text>
  <text class="small" x="995" y="190" text-anchor="middle">Mapping</text>

  <path class="arrow" d="M1105 172 L1175 172"/>

  <rect class="box-yellow" x="1185" y="120" width="220" height="105" rx="22"/>
  <text class="label" x="1295" y="160" text-anchor="middle">Music</text>
  <text class="small" x="1295" y="190" text-anchor="middle">Generator</text>

  <path class="arrow" d="M1295 225 L1295 275 L100 275 L100 245"/>

  <rect class="box-pink" x="250" y="250" width="255" height="85" rx="22"/>
  <text class="label" x="377.5" y="286" text-anchor="middle">MIDI / WAV</text>
  <text class="small" x="377.5" y="313" text-anchor="middle">Output</text>

  <path class="arrow" d="M505 292 L590 292"/>

  <rect class="box-blue" x="600" y="250" width="270" height="85" rx="22"/>
  <text class="label" x="735" y="286" text-anchor="middle">Preview</text>
  <text class="small" x="735" y="313" text-anchor="middle">Piano roll + audio</text>

  <path class="arrow" d="M870 292 L955 292"/>

  <rect class="box-blue" x="965" y="250" width="270" height="85" rx="22"/>
  <text class="label" x="1100" y="286" text-anchor="middle">Download</text>
  <text class="small" x="1100" y="313" text-anchor="middle">History storage</text>
</svg>
