<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Text Muse FYP2 System Architecture</title>
  <desc id="desc">A system architecture diagram for Text Muse showing user input, web interface, backend API, emotion mapping, music generation, generated output, and Firebase services.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#26305f"/>
    </marker>
    <style>
      .bg { fill: #fbf6ec; }
      .title { font: 700 42px Arial, sans-serif; fill: #26305f; letter-spacing: .4px; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #4a527c; }
      .band { fill: #d7f1ec; stroke: #26305f; stroke-width: 4; rx: 28; }
      .section-label { font: 700 25px Arial, sans-serif; fill: #26305f; }
      .box { fill: #ffffff; stroke: #26305f; stroke-width: 3.5; rx: 18; }
      .box-accent { fill: #fff4c7; stroke: #26305f; stroke-width: 3.5; rx: 18; }
      .box-green { fill: #e6f6e8; stroke: #26305f; stroke-width: 3.5; rx: 18; }
      .box-blue { fill: #e8f0ff; stroke: #26305f; stroke-width: 3.5; rx: 18; }
      .box-pink { fill: #ffe8ec; stroke: #26305f; stroke-width: 3.5; rx: 18; }
      .text { font: 700 23px Arial, sans-serif; fill: #26305f; }
      .small { font: 400 19px Arial, sans-serif; fill: #303a67; }
      .tiny { font: 400 17px Arial, sans-serif; fill: #4a527c; }
      .arrow { stroke: #26305f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #59618b; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow); }
      .icon { fill: none; stroke: #26305f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="title" x="800" y="70" text-anchor="middle">Text Muse System Architecture</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">AI chatbot-driven personalized MIDI music generation based on emotion and style preferences</text>

  <!-- User layer -->
  <rect class="band" x="95" y="145" width="1410" height="145" rx="32"/>
  <text class="section-label" x="135" y="185">User Layer</text>
  <g transform="translate(198 190)">
    <circle class="icon" cx="36" cy="20" r="18"/>
    <path class="icon" d="M6 78 C8 45 64 45 66 78"/>
    <text class="text" x="105" y="30">User</text>
    <text class="small" x="105" y="61">Inputs prompt, emotion, style and instruments</text>
  </g>
  <g transform="translate(1010 190)">
    <circle class="icon" cx="36" cy="20" r="18"/>
    <path class="icon" d="M6 78 C8 45 64 45 66 78"/>
    <text class="text" x="105" y="30">Admin / Tester</text>
    <text class="small" x="105" y="61">Reviews output and system behaviour</text>
  </g>

  <!-- Frontend layer -->
  <rect class="band" x="95" y="342" width="1410" height="170" rx="32"/>
  <text class="section-label" x="135" y="382">Frontend Layer</text>
  <rect class="box-blue" x="210" y="405" width="1180" height="70" rx="18"/>
  <text class="text" x="800" y="448" text-anchor="middle">Text Muse Web Interface</text>
  <rect class="box" x="210" y="520" width="275" height="78" rx="18"/>
  <text class="small" x="347.5" y="552" text-anchor="middle">Login / Register</text>
  <text class="tiny" x="347.5" y="577" text-anchor="middle">Password reset</text>
  <rect class="box" x="662.5" y="520" width="275" height="78" rx="18"/>
  <text class="small" x="800" y="552" text-anchor="middle">Chat Prompt</text>
  <text class="tiny" x="800" y="577" text-anchor="middle">Music request</text>
  <rect class="box" x="1115" y="520" width="275" height="78" rx="18"/>
  <text class="small" x="1252.5" y="552" text-anchor="middle">Preview / Download</text>
  <text class="tiny" x="1252.5" y="577" text-anchor="middle">History page</text>

  <!-- Backend layer -->
  <rect class="band" x="95" y="650" width="1410" height="215" rx="32"/>
  <text class="section-label" x="135" y="690">Backend and Generation Layer</text>

  <rect class="box-accent" x="625" y="705" width="350" height="78" rx="18"/>
  <text class="small" x="800" y="737" text-anchor="middle">Flask Backend API</text>
  <text class="tiny" x="800" y="762" text-anchor="middle">Request controller</text>

  <rect class="box" x="175" y="725" width="280" height="78" rx="18"/>
  <text class="small" x="315" y="757" text-anchor="middle">Authentication</text>
  <text class="tiny" x="315" y="782" text-anchor="middle">Firebase token check</text>

  <rect class="box" x="1145" y="725" width="280" height="78" rx="18"/>
  <text class="small" x="1285" y="757" text-anchor="middle">History Service</text>
  <text class="tiny" x="1285" y="782" text-anchor="middle">Save generation records</text>

  <rect class="box-green" x="285" y="835" width="330" height="82" rx="18"/>
  <text class="small" x="450" y="866" text-anchor="middle">Emotion Detection</text>
  <text class="tiny" x="450" y="891" text-anchor="middle">Keyword groups and emotion score</text>

  <rect class="box-green" x="635" y="835" width="330" height="82" rx="18"/>
  <text class="small" x="800" y="866" text-anchor="middle">Emotion Mapping</text>
  <text class="tiny" x="800" y="891" text-anchor="middle">Valence, arousal, tempo, density</text>

  <rect class="box-pink" x="985" y="835" width="330" height="82" rx="18"/>
  <text class="small" x="1150" y="866" text-anchor="middle">Music Generation</text>
  <text class="tiny" x="1150" y="891" text-anchor="middle">MIDI-GPT + baseline fallback</text>

  <!-- Storage/output layer -->
  <g transform="translate(0 -6)">
    <rect class="box-blue" x="175" y="932" width="420" height="62" rx="18"/>
    <text class="small" x="385" y="971" text-anchor="middle">Firebase Auth / Firestore / Storage</text>
    <rect class="box-accent" x="995" y="932" width="420" height="62" rx="18"/>
    <text class="small" x="1205" y="960" text-anchor="middle">Generated Output</text>
    <text class="tiny" x="1205" y="982" text-anchor="middle">MIDI file, WAV preview, piano roll</text>
  </g>

  <!-- Main flow arrows -->
  <path class="arrow" d="M800 290 L800 342"/>
  <path class="arrow" d="M800 475 L800 520"/>
  <path class="arrow" d="M800 598 L800 705"/>
  <path class="arrow" d="M800 783 L800 835"/>
  <path class="arrow" d="M965 876 L985 876"/>
  <path class="arrow" d="M1150 917 L1205 926"/>

  <!-- Backend service arrows -->
  <path class="arrow" d="M625 744 L455 764"/>
  <path class="arrow" d="M975 744 L1145 764"/>
  <path class="arrow" d="M625 770 L455 835"/>
  <path class="arrow" d="M615 876 L635 876"/>

  <!-- Storage dashed arrows -->
  <path class="dash" d="M315 803 L340 926"/>
  <path class="dash" d="M1285 803 L1205 926"/>
  <path class="dash" d="M1150 917 L760 926 L595 963"/>

  <!-- Labels -->
  <text class="tiny" x="927" y="815">emotion parameters</text>
  <text class="tiny" x="1228" y="824">history records</text>
  <text class="tiny" x="1050" y="952">music files</text>
</svg>
